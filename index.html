<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSDI Quick Intake</title>
<style>
:root{--bg:#050b14;--panel:#0b1422;--card:#101d2e;--line:#263b56;--text:#f4f7fb;--muted:#9aabc0;--blue:#3b82f6}
*{box-sizing:border-box}body{margin:0;color:var(--text);font:15px Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#102b4d 0,transparent 35%),linear-gradient(135deg,#040912,#07111e);min-height:100vh}
.wrap{max-width:980px;margin:auto;padding:28px 18px 60px}.top{position:sticky;top:12px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:16px 20px;border:1px solid var(--line);border-radius:16px;background:#091321ee;backdrop-filter:blur(14px);box-shadow:0 18px 50px #0008}
.brand{display:flex;gap:12px;align-items:center}.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#60a5fa);font-weight:900}.brand b{display:block}.brand small{color:var(--muted)}
button{border:1px solid #2c4563;border-radius:10px;padding:10px 14px;background:#101f32;color:#fff;font-weight:800;cursor:pointer}.primary{background:#2563eb;border-color:#4c8df8}.danger{background:#35151b;border-color:#71303a}
.hero{padding:34px 4px 20px}.eyebrow{color:#60a5fa;font-size:11px;font-weight:900;letter-spacing:1.5px}.hero h1{font-size:32px;margin:7px 0}.hero p{color:var(--muted);line-height:1.6}.bar{height:6px;background:#0d1928;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#3b82f6;transition:.2s}
.card{background:#0e1b2b;border:1px solid var(--line);border-radius:16px;padding:21px;margin:14px 0;box-shadow:0 12px 35px #0004}.num{font-size:11px;color:#60a5fa;font-weight:900}.q{font-size:17px;font-weight:800;margin-top:5px;line-height:1.45}.choices{display:flex;gap:9px;margin-top:17px;flex-wrap:wrap}.choice{min-width:105px}.choice.selected{background:#123f78;border-color:#60a5fa;box-shadow:0 0 0 2px #3b82f633}
input,textarea{width:100%;margin-top:16px;padding:13px;border-radius:11px;border:1px solid #2c4563;background:#081321;color:#fff;font:inherit;outline:0}textarea{min-height:120px;resize:vertical}input:focus,textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #3b82f622}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border:1px solid var(--line);border-radius:15px;background:#091321}.status{color:var(--muted);font-size:13px}
@media(max-width:650px){.top{position:static;flex-direction:column;align-items:stretch}.hero h1{font-size:27px}}
</style></head><body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">S</div><div><b>SSDI QUICK INTAKE</b><small>7-question screening form</small></div></div><div><button class="primary" onclick="exportDocx()">Export DOCX</button> <button class="danger" onclick="resetForm()">Reset</button></div></header>
<section class="hero"><div class="eyebrow">QUICK ATTORNEY INTAKE</div><h1>Disability Screening</h1><p>Only the seven questions requested. Fill them out and export the completed answers.</p><div class="bar"><i id="prog"></i></div></section>
<main id="app"></main>
<div class="bottom"><span class="status" id="status">0 of 7 completed</span><button class="primary" onclick="exportDocx()">Export DOCX</button></div>
</div>
<script>
const qs=[
['Have you applied for disability before','choice',['YES','NO']],
['When did you last work','date'],
['How long work there','text'],
['Let me confirm you worked 5 out last 10 yr','choice',['YES','NO']],
['Do you see a doctor and on medications','choice',['YES','NO']],
['Age','number'],
["What going on why can't you work anymore",'textarea']
];
const a={};
function render(){const root=document.getElementById('app');root.innerHTML='';qs.forEach((x,i)=>{let c=document.createElement('section');c.className='card';let ctl='';
if(x[1]=='choice')ctl='<div class="choices">'+x[2].map(v=>'<button class="choice" type="button" data-i="'+i+'" data-v="'+v+'">'+v+'</button>').join('')+'</div>';
else if(x[1]=='textarea')ctl='<textarea data-i="'+i+'" placeholder="Enter the claimant answer..."></textarea>';
else ctl='<input data-i="'+i+'" type="'+x[1]+'" placeholder="'+(x[1]=='number'?'Enter age':'')+'">';
c.innerHTML='<div class="num">QUESTION '+(i+1)+'</div><div class="q">'+x[0]+'</div>'+ctl;root.appendChild(c)});
root.querySelectorAll('input,textarea').forEach(e=>e.oninput=()=>{a[e.dataset.i]=e.value;update()});
root.querySelectorAll('.choice').forEach(e=>e.onclick=()=>{a[e.dataset.i]=e.dataset.v;root.querySelectorAll('.choice[data-i="'+e.dataset.i+'"]').forEach(b=>b.classList.remove('selected'));e.classList.add('selected');update()});update()}
function update(){let n=Object.values(a).filter(v=>String(v).trim()).length;document.getElementById('status').textContent=n+' of 7 completed';document.getElementById('prog').style.width=(n/7*100)+'%'}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function exportDocx(){const rows=qs.map((q,i)=>'<w:p><w:r><w:rPr><w:b/></w:rPr><w:t>'+esc((i+1)+'. '+q[0])+'</w:t></w:r></w:p><w:p><w:r><w:t>Answer: '+esc(a[i]||'Not answered')+'</w:t></w:r></w:p>').join('');
const doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>SSDI QUICK INTAKE — ANSWER RECORD</w:t></w:r></w:p>'+rows+'<w:sectPr/></w:body></w:document>';
const htmlDoc='<html><head><meta charset="utf-8"></head><body><h1>SSDI QUICK INTAKE — ANSWER RECORD</h1>'+qs.map((q,i)=>'<h3>'+esc((i+1)+'. '+q[0])+'</h3><p>Answer: '+esc(a[i]||'Not answered')+'</p>').join('')+'</body></html>';
const blob=new Blob([htmlDoc],{type:'application/msword'});const u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='SSDI_Quick_Intake_Answer_Record.doc';link.click();URL.revokeObjectURL(u)}
function resetForm(){if(confirm('Clear all seven answers?')){for(const k in a)delete a[k];render()}}
render();
</script></body></html>
